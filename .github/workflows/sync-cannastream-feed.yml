name: Sync Cannastream market feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/export-market-feed.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Cannastream and export feed
        run: |
          git clone --depth 1 https://github.com/noprobono-can/cannastream-app /tmp/cannastream-app
          python scripts/export-market-feed.py \
            --cannastream /tmp/cannastream-app \
            --out data/market-feed.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-feed.json
          if git diff --staged --quiet; then
            echo "Market feed unchanged."
            exit 0
          fi
          git commit -m "Auto-sync Cannastream market feed."
          git push
