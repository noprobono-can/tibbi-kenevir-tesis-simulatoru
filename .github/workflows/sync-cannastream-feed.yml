name: Sync Cannastream market feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/export-market-feed.py
      - scripts/enrich_market_external.py
      - data/market-feed.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install enrichment dependencies
        run: pip install requests

      - name: Clone Cannastream, export and enrich feed
        env:
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ENRICH_MARKET_FEED: "1"
        run: |
          git clone --depth 1 https://github.com/noprobono-can/cannastream-app /tmp/cannastream-app
          cd scripts
          python export-market-feed.py \
            --cannastream /tmp/cannastream-app \
            --out ../data/market-feed.json \
            --enrich

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-feed.json
          if git diff --staged --quiet; then
            echo "Market feed unchanged."
            exit 0
          fi
          git commit -m "Auto-sync Cannastream market feed with Linkup/Firecrawl enrichment."
          git push
